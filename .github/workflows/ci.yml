name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shopdesk
          POSTGRES_PASSWORD: shopdesk
          POSTGRES_DB: shopdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://shopdesk:shopdesk@localhost:5432/shopdesk_test
      TEST_DATABASE_URL: postgresql+psycopg://shopdesk:shopdesk@localhost:5432/shopdesk_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff check --config pyproject.toml ../api
      - run: black --check .
      - run: black --check ../api
      - run: mypy
      - run: pytest -q --cov --cov-report=term-missing:skip-covered
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/check-production-env.test.mjs
      - run: npm run build -w web

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact
