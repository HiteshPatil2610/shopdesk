[project]
name = "shopdesk-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations/versions"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM"]
ignore = ["E501"]  # black owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # asserts, fake secrets, random data

[tool.ruff.lint.isort]
known-first-party = ["core", "shopdesk", "admin_area", "pos_area"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["core"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs the Postgres test database (TEST_DATABASE_URL)",
    "concurrency: commits for real; runs last",
]
filterwarnings = [
    "ignore:The '__version__' attribute is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["core", "shopdesk", "admin_area", "pos_area"]
omit = ["*/migrations/*"]
